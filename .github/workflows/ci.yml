name: CI

# Ticket 01 requires both example tests to pass in CI. This is also where module boundary
# enforcement lands in ticket 05 — those are static checks, not runtime tests, so they belong
# in the pipeline rather than in the suite.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://erp:erp_local_dev@localhost:55432/erp_dev?schema=public
      TEST_DATABASE_URL: postgresql://erp:erp_local_dev@localhost:55432/erp_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The compose file creates erp_test on first boot; the CI service container does not
      # use that file, so it is created explicitly here.
      - name: Create the test database
        run: PGPASSWORD=erp_local_dev psql -h localhost -p 55432 -U erp -d erp_dev -c 'CREATE DATABASE erp_test OWNER erp;'

      - name: Write backend environment
        run: cp backend/.env.example backend/.env

      - run: npm run build --workspace packages
      - run: npm run db:generate --workspace backend
      - run: npm run db:deploy --workspace backend

      - run: npm run typecheck

      # A static check, not a test: it needs no database and no running application, and a
      # module graph that cannot be assembled should fail here rather than at deploy time.
      - run: npm run check:modules

      - run: npm run build
      - run: npm test
